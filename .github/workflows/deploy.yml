name: Deploy NEURA and Casil Shots
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: casil-shots-app/package-lock.json
      - name: Build Casil Shots subsite
        run: |
          npm ci --prefix casil-shots-app
          npm run build --prefix casil-shots-app
      - name: Stage existing NEURA site and Casil Shots
        run: |
          mkdir -p _site/casil-shots
          cp -a index.html administrator.html chart-of-accounts.html customer.html purchase-journal.html sales-journal.html app.js styles.css neura-mark.svg css images js neura-sheet _site/
          cp -a casil-shots-app/dist/. _site/casil-shots/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4